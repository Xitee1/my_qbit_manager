[build-system]
requires = [
  "hatchling",
  "hatch-vcs"
]
build-backend = "hatchling.build"

[project]
name = "my-qbit-manager"
dynamic = ["version"]
description = "A modular tool for managing qBittorrent torrents"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "qbittorrent-api>=2025.11.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pylint>=2.17.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/my-qbit-manager"
Repository = "https://github.com/yourusername/my-qbit-manager"
Issues = "https://github.com/yourusername/my-qbit-manager/issues"

[project.scripts]
qbit-manager = "my_qbit_manager.main:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/my_qbit_manager"]

[tool.hatch.build.targets.wheel.force-include]
"src/my_qbit_manager/config.default.yaml" = "my_qbit_manager/config.default.yaml"