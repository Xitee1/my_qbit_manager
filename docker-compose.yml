services:
  qbit-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qbit-manager
    
    # qBittorrent configuration (overrides options in config.yaml)
    environment:
      - QBIT_HOST=${QBIT_HOST:-localhost}
      - QBIT_PORT=${QBIT_PORT:-8080}
      - QBIT_USERNAME=${QBIT_USERNAME:-admin}
      - QBIT_PASSWORD=${QBIT_PASSWORD:-adminpass}
      - QBIT_USE_SSL=${QBIT_USE_SSL:-false}
    
    # Mount volumes
    volumes:
      # Configuration file
      - ./config/config.yaml:/app/config/config.yaml:ro
      # Optional: mount custom modules (for development)
      # - ./src/my_qbit_manager/modules:/app/src/my_qbit_manager/modules:ro
    
    restart: unless-stopped
