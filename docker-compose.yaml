services:
  qbit-manager:
    build:
      context: .
      dockerfile: Dockerfile
    
    # qBittorrent configuration (overrides options in config.yaml)
    environment:
      - QBIT_HOST=192.168.1.1 # replace with your qBittorrent host
      - QBIT_PORT=8080
      - QBIT_USERNAME=admin
      - QBIT_PASSWORD=password
      - QBIT_USE_SSL=false
    
    # Mount volumes
    volumes:
      # Configuration file
      - ./config/config.yaml:/app/config/config.yaml:ro

      # Development: mount source code for live changes
      - ./src/my_qbit_manager:/app/src/my_qbit_manager:ro
    
    restart: unless-stopped
