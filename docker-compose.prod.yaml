services:
  qbit-manager:
    image: ghcr.io/xitee1/my_qbit_manager:latest
    
    # qBittorrent configuration (overrides options in config.yaml)
    environment:
      - QBIT_HOST=192.168.1.1 # replace with your qBittorrent host
      - QBIT_PORT=8080
      - QBIT_USERNAME=admin
      - QBIT_PASSWORD=password
      - QBIT_USE_SSL=false
    
    volumes:
      - ./config:/app/config
    
    restart: unless-stopped
